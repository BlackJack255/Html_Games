<!DOCTYPE html>
<html>
    <head>
        <!-- ref: https://getbootstrap.com/docs/5.3/getting-started/introduction/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <link href="style.css" rel="stylesheet"/>
        <title>Guess Number</title>
    </head>
    <body>
        <br>
        <h2 class="digit-group">Guess number, each number between 0 - 9, every digit unique</h2>

        <h4 class="digit-group" id="guess-table"></h4>
        <h5 class="digit-group" id="warning-str"><br></h5>

        <!-- restrict input numerical, oninput https://stackoverflow.com/questions/68394492/input-with-type-number-that-allows-only-numbers-to-be-typed-->
        <div class="digit-group">
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="digit-input" oninput="this.value = this.value.replace(/\D/g, '')" autofocus />
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="digit-input" oninput="this.value = this.value.replace(/\D/g, '')"/>
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="digit-input" oninput="this.value = this.value.replace(/\D/g, '')"/>
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="digit-input" oninput="this.value = this.value.replace(/\D/g, '')"/>
            <button class="butt" id="guess-butt">Guess!</button>
        </div>

        <br>
        
        <div class="digit-group">
            <button class="hid-butt" id="again-butt">Play Again</button>
        </div>
        


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <script src="index.js"></script>
    </body>

</html>
