<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
    </head>
    <body>
        <div align="center">
            <p id="msg"></p>
            <div id="searchdata" style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;">
                <div id="searchdata-0"></div>
                <div id="searchdata-1"></div>
                <div id="searchdata-2"></div>
                <div id="searchdata-3"></div>
            </div>
            <h3 id="hcp-info"></h3>
            <div id="choose-contract", style="display: none">
                <span>Choose a suit as trump</span>
                <div>
                    <input type="RADIO" id="choose-suit" name="choose-suit"  value="0">
                    <label for="choose-suit">Spade</label>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="RADIO" id="choose-suit" name="choose-suit"  value="1">
                    <label for="choose-suit">Heart</label>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="RADIO" id="choose-suit" name="choose-suit"  value="2">
                    <label for="choose-suit">Dimond</label>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="RADIO" id="choose-suit" name="choose-suit"  value="3">
                    <label for="choose-suit">Club</label>
                </div>

                <span>Select contract levels</span>
                <div>
                    <input type="RADIO" id="trick-level" name="trick-level"  value="7">
                    <label for="trick-level">1</label>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="RADIO" id="trick-level" name="trick-level"  value="8">
                    <label for="trick-level">2</label>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="RADIO" id="trick-level" name="trick-level"  value="9">
                    <label for="trick-level">3</label>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="RADIO" id="trick-level" name="trick-level"  value="10">
                    <label for="trick-level">4</label>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="RADIO" id="trick-level" name="trick-level"  value="11">
                    <label for="trick-level">5</label>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="RADIO" id="trick-level" name="trick-level"  value="12">
                    <label for="trick-level">6</label>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <input type="RADIO" id="trick-level" name="trick-level"  value="13">
                    <label for="trick-level">7</label>
                </div>

                <button type="button" id="set-contract">Set contract</button>
            </div>

            <h3 id="contract-info"></h3>
            <div id="dummy-hands"></div>
            <div id="current-plays"></div>
            <div id="result">Result:<br></div>
        
            <div id="human-hands"></div>
            <div id="settings" class="hidden">
            Max search trials <select id="maxtrials" class="select">
                <option value="1000" selected>1000</option>
                <option value="10000">10000</option>
                <option value="100000">100000</option>
                <option value="200000">200000</option>
            </select>
            <br/>
            Max search time <select id="maxtime" class="select">
                <option value="5000" selected>5 sec</option>
                <option value="10000">10 sec</option>
                <option value="20000">20 sec</option>
                <option value="40000">40 sec</option>
            </select>
            </div>
            <button type="button" id="next-trick">Next Trick</button>
            <pre style="display: inline;">   </pre>
            <button type="button" id="replay-again">Replay Again</button>
        </div>

        <script src="js/nodehack.js"></script>
        <script src="js/mcts.js"></script>
        <script src="js/ismcts.js"></script>
        <script src="js/bridgeDatas.js"></script>
        <script src="js/miniBridge.js"></script>
        <script src="script.js"></script>
    </body>
</html>
