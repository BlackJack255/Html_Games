<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div align="center">
            <p id="msg"></p>
            <div id="searchdata" style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;">
                <div id="searchdata-0"></div>
                <div id="searchdata-1"></div>
                <div id="searchdata-2"></div>
                <div id="searchdata-3"></div>
            </div>
            <h3>Choose game level</h3>
            <!-- radio: https://csveda.com/html-radiobutton/ -->
            <div>
                <input type="RADIO" id="game-level" name="game-level"  value="3" checked>
                <label for="game-level">12 cards</label>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="RADIO" id="game-level" name="game-level"  value="6">
                <label for="game-level">24 cards</label>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="RADIO" id="game-level" name="game-level"  value="9">
                <label for="game-level">36 cards</label>
            </div>
            <br>
            <button type="button" id="deal">Deal</button>
            <br>
            <span>---------------------------------------------------</span>
            <br>
            <br>

            <div id="center-piles" class="piles"></div>
            <br>
            <button type="button" id="pick">Pick</button>
            <br>
            
            <div id="current-plays"></div>
            <div id="result">Result:<br></div>
            <div id="collect-hands"></div>

            <button type="button" id="replay-again">Replay Again</button>
        </div>
        <script src="js/nodehack.js"></script>
        <script src="js/mcts.js"></script>
        <script src="js/nimbly.js"></script>
        <script src="script.js"></script>
    </body>
</html>
