  </head>
  <body>
    <div class="wrapper">
      <!-- Mode selection screen -->
      <div id="modeScreen" class="mode-screen">
        <h1>Chess</h1>
        <p>Choose game mode</p>
        <div class="mode-buttons">
          <button type="button" id="vsFriendBtn" class="mode-btn">
            <span class="mode-icon">👥</span>
            Vs Friend
          </button>
          <button type="button" id="vsAiBtn" class="mode-btn">
            <span class="mode-icon">🤖</span>
            Vs AI
          </button>
        </div>
      </div>

      <!-- Game screen -->
      <div id="gameScreen" class="game-screen hidden">
        <header class="header">
          <h1>Chess</h1>
          <div class="game-info">
            <span class="turn-label" id="turnLabel">White to move</span>
            <span class="mode-badge" id="modeBadge">Vs Friend</span>
            <button type="button" id="newGameBtn" class="btn">New Game</button>
            <button type="button" id="changeModeBtn" class="btn btn-ghost">Change Mode</button>
          </div>
        </header>

        <div>
          Computer<select id="computerplayer" class="select">
            <option value="1">Player 1</option>
            <option value="2" selected>Player 2</option>
          </select>
        </div>

        <main class="game-container">
          <div id="board" class="board"></div>
          <div class="promotion-overlay hidden" id="promotionOverlay">
            <p>Promote pawn to:</p>
            <div class="promotion-pieces" id="promotionPieces"></div>
          </div>
        </main>

        <div id="gameOverOverlay" class="game-over-overlay hidden">
          <div class="game-over-box">
            <h2 id="gameOverTitle">Checkmate!</h2>
            <p id="gameOverMessage"></p>
            <button type="button" id="playAgainBtn" class="btn btn-large">Play Again</button>
          </div>
        </div>

        <!-- only AI mode visible-->
        <div id="settings" align="center" class="hidden">
          Max search trials <select id="maxtrials" class="select">
            <option value="10" selected>10</option>
            <option value="100">100</option>
            <option value="1000">1000</option>
            <option value="10000">10000</option>
            <option value="100000">100000</option>
          </select>
          <br/>
          Max search time <select id="maxtime" class="select">
            <option value="1000" selected>1 sec</option>
            <option value="10000">10 sec</option>
          </select>
        </div>
        <p id="msg" class="text-center hidden"></p>
        <div id="searchdata" class="hidden" style="width: 100%; max-width: 400px; margin: auto; text-align: center;"></div>
      </div>
    </div>

    <script src="js/nodehack.js"></script>
    <script src="js/mcts.js"></script>
    <script src="js/amazons.js"></script>
    <script src="script.js"></script>
  </body>
</html>
